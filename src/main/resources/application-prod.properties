# =============================================================================
# FactoryFlow 운영(Production) 환경 설정 (SPRING_PROFILES_ACTIVE=prod)
# 모든 민감 정보(DB URL/계정/비밀번호, CORS 도메인)는 클라우드 환경변수로 주입합니다.
# =============================================================================

# Database (외부 MySQL: Railway MySQL, Aiven, AWS RDS 등)
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 무료/소규모 클라우드 MySQL 동시 접속 제한을 고려한 안전한 커넥션 풀 설정
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
# 최초 배포 시 빈 DB에 테이블 생성을 위해 update 기본값 사용 (초기화 후 validate 전환 권장)
# 주의: create / create-drop 은 데이터 유실 위험으로 절대 사용하지 않습니다.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS 허용 도메인 (쉼표로 복수 지정 가능, 예: https://factoryflow.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 클라우드 리버스 프록시(Render/Railway) 뒤에서 HTTPS/호스트 헤더 인식 및 안전한 종료
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# 운영 로그 레벨
logging.level.root=INFO
logging.level.com.lgb.factoryflow=INFO
