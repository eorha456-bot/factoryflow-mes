# 로컬 개발용 설정 예시 파일 (Git에 포함되는 템플릿)
# 사용 방법:
# 1. 이 파일을 참고하여 같은 폴더에 application-local.properties 파일을 준비합니다.
# 2. 실제 DB 아이디/비밀번호를 파일에 직접 적지 말고,
#    OS 환경변수 또는 IntelliJ 실행 설정에 DB_USERNAME, DB_PASSWORD를 등록하세요.

spring.datasource.url=jdbc:mysql://localhost:3306/factoryflow?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 개발 단계 스키마 자동 반영(update 제한, 절대 create/create-drop 사용 금지)
spring.jpa.hibernate.ddl-auto=update

# 로컬 개발 전용 SQL 로그 출력 및 가독성 포맷팅
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
