spring.application.name=factoryflow
spring.profiles.default=local

# 클라우드 PaaS(Render/Railway)가 주입하는 PORT 환경변수 지원 (미설정 시 8080)
server.port=${PORT:8080}

# OSIV 비활성화: 컨트롤러 계층까지 DB 커넥션을 불필요하게 점유하지 않도록 설정
spring.jpa.open-in-view=false

# 기본 CORS 허용 오리진 (운영 환경에서는 application-prod.properties / CORS_ALLOWED_ORIGINS로 덮어씀)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173